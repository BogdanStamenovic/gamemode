[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gamemode"
version = "0.1.0"
description = "Switch archserver into Windows for game streaming and back, headlessly."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bogdan Stamenovic" }]
keywords = ["moonlight", "apollo", "dual-boot", "cli"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0,<10", "ruff>=0.6,<1", "mypy>=1.11,<3"]

[project.scripts]
gaming = "gamemode.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gamemode"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["hivex"]
ignore_missing_imports = true
