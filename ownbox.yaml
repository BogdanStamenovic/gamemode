schema: 1
name: gamemode
description: Switch archserver into Windows for game streaming (Apollo + Moonlight) and back, headlessly, with a Windows-side service and a pigion relay.
homepage: https://github.com/BogdanStamenovic/gamemode
tags: [cli, gaming, dual-boot, moonlight, windows, python, go]
install:
  platforms: [linux]
  # Full lifecycle, role-aware (see scripts/lifecycle.sh): on archserver it is
  # venv + CLI, vendored hivex, Apollo installer, the Windows service, the relay
  # on pigion, the boot hook, and re-planting Windows files if prepared before
  # (registry only rewritten when a value differs, with a backup first).
  # On the laptop it is the CLI plus Apollo credentials copied from archserver.
  setup: [scripts/lifecycle.sh setup]
  update: [scripts/lifecycle.sh update]
  remove: [scripts/lifecycle.sh remove]
commands:
  gaming: .venv/bin/gaming
